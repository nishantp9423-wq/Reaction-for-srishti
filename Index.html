<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Reaction</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Playfair Display', serif;
            overflow: hidden; /* Prevents scrollbars when emojis fly off-screen */
            user-select: none; /* Prevents text selection during rapid clicking */
            background: linear-gradient(135deg, #fff0f3 0%, #ffccd5 100%);
            height: 100vh;
            width: 100vw;
            margin: 0;
        }

        /* Styling for the floating emojis */
        .emoji-particle {
            position: absolute;
            pointer-events: none; /* Allows clicks to pass through them */
            font-size: 2.5rem;
            transform: translate(-50%, -50%);
            animation: burstFly 2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            will-change: transform, opacity;
            z-index: 10;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        /* Physics-like animation for the emojis bursting outwards */
        @keyframes burstFly {
            0% {
                transform: translate(-50%, -50%) scale(0.1) rotate(0deg);
                opacity: 1;
            }
            15% {
                transform: translate(calc(-50% + var(--dx) * 0.2), calc(-50% + var(--dy) * 0.2)) scale(var(--scale)) rotate(calc(var(--rot) * 0.2));
                opacity: 1;
            }
            80% {
                opacity: 0.9;
            }
            100% {
                transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(var(--scale)) rotate(var(--rot));
                opacity: 0;
            }
        }

        /* Gentle pulse animation for the initial prompt */
        @keyframes pulse-gentle {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }
        
        .animate-pulse-gentle {
            animation: pulse-gentle 2.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="flex items-center justify-center cursor-pointer">

    <!-- Initial Instruction Text -->
    <div id="initial-text" class="text-center absolute z-20 transition-opacity duration-1000 ease-out pointer-events-none px-6">
        <h1 class="text-3xl md:text-5xl text-rose-800 font-semibold mb-4 drop-shadow-sm">Click anywhere...</h1>
        <p class="text-rose-600 text-xl md:text-2xl animate-pulse-gentle italic">to see my reaction</p>
    </div>

    <!-- Final Message (Hidden initially) -->
    <div id="final-message" class="hidden text-center absolute z-30 px-6 max-w-3xl opacity-0 translate-y-8 transition-all duration-1000 ease-out pointer-events-none">
        <h2 class="text-4xl md:text-6xl text-rose-900 font-semibold leading-tight drop-shadow-md">
            Thank you for your words.
        </h2>
        <p class="mt-6 text-2xl md:text-3xl text-rose-800 italic font-light drop-shadow-sm">
            I can only describe from this reaction.
        </p>
    </div>

    <script>
        // Configuration
        const emojis = ['💐', '🌺', '❤️', '😍'];
        const burstDuration = 10000; // 10 seconds in milliseconds
        const particleLifetime = 2000; // 2 seconds animation duration
        let hasTriggered = false;
        let burstInterval;

        // Listen for clicks anywhere on the body
        document.body.addEventListener('click', (e) => {
            // Prevent multiple triggers
            if (hasTriggered) return;
            hasTriggered = true;

            const startX = e.clientX;
            const startY = e.clientY;

            // 1. Hide the initial instruction text smoothly
            const initialText = document.getElementById('initial-text');
            initialText.style.opacity = '0';
            setTimeout(() => {
                initialText.style.display = 'none';
            }, 1000);

            // 2. Initial big pop of emojis to start things off
            for(let i = 0; i < 40; i++) {
                spawnEmoji(startX, startY);
            }

            // 3. Continuous burst fountain for 10 seconds
            burstInterval = setInterval(() => {
                // Spawn 3-4 emojis every 40ms to create a dense, continuous flow
                for(let i = 0; i < 3; i++) {
                    spawnEmoji(startX, startY);
                }
            }, 40);

            // 4. Stop the burst after exactly 10 seconds
            setTimeout(() => {
                clearInterval(burstInterval);
                
                // Wait for the final emojis to finish flying before showing the message
                setTimeout(() => {
                    revealFinalMessage();
                }, particleLifetime + 500); // 2.5 seconds delay

            }, burstDuration);
        });

        function spawnEmoji(x, y) {
            const el = document.createElement('div');
            el.className = 'emoji-particle';
            
            // Pick a random emoji from the array
            el.innerText = emojis[Math.floor(Math.random() * emojis.length)];

            // Calculate random trajectories and physical properties
            const angle = Math.random() * Math.PI * 2; // Random 360 degree direction
            const velocity = Math.random() * 600 + 150; // Distance it will travel (150px to 750px)
            
            // Convert polar to cartesian coordinates for X/Y translation
            const dx = Math.cos(angle) * velocity;
            const dy = Math.sin(angle) * velocity;
            
            // Randomize size and rotation for organic feel
            const scale = Math.random() * 0.8 + 0.6; // Scale between 0.6x and 1.4x
            const rot = Math.random() * 360 - 180; // Rotation between -180 and +180 degrees

            // Apply starting positions and custom CSS variables for the keyframe animation
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            el.style.setProperty('--dx', `${dx}px`);
            el.style.setProperty('--dy', `${dy}px`);
            el.style.setProperty('--scale', scale);
            el.style.setProperty('--rot', `${rot}deg`);

            // Add to DOM
            document.body.appendChild(el);

            // Clean up the DOM element after its animation finishes to maintain performance
            setTimeout(() => {
                el.remove();
            }, particleLifetime);
        }

        function revealFinalMessage() {
            const finalMsg = document.getElementById('final-message');
            
            // Remove hidden class so it's in the DOM flow
            finalMsg.classList.remove('hidden');
            
            // Trigger a browser reflow so the transition animations will execute properly
            void finalMsg.offsetWidth;
            
            // Apply classes to slide up and fade in
            finalMsg.classList.remove('opacity-0', 'translate-y-8');
            finalMsg.classList.add('opacity-100', 'translate-y-0');
        }
    </script>
</body>
</html>
